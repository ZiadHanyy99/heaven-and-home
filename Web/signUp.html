<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up</title>
  <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css" />
  <style>
    body {
      background-color: rgb(235, 246, 244);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100vh;
    }

    .form-box {
      background: white;
      padding: 40px;
      border-radius: 15px;
      text-align: center;
      width: 350px;
      box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
    }

    .logo-container {
      margin-bottom: 20px;
    }

    .logo {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
    }

    .title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .input-group {
      display: flex;
      align-items: center;
      background: #f0f0f0;
      padding: 10px;
      border-radius: 25px;
      margin-bottom: 15px;
    }

    .input-group i {
      margin-right: 10px;
      color: #555;
    }

    .input-group input {
      border: none;
      background: none;
      outline: none;
      width: 100%;
      font-size: 16px;
    }

    .submit-button {
      width: 100%;
      background: black;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 25px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.3s;
    }

    .submit-button:hover {
      background: rgb(155, 138, 18);
    }

    .switch-text {
      margin-top: 10px;
      font-size: 14px;
    }

    .switch-text a {
      color: black;
      text-decoration: none;
    }

    .switch-text a:hover {
      text-decoration: underline;
    }

    .error-message {
      color: red;
      font-size: 16px;
      margin-top: 10px;
      margin-bottom: 10px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="form-box">
      <div class="logo-container">
        <img src="Images/logo.jpg" alt="Logo" class="logo" />
      </div>

      <h2 class="title">Create an Account</h2>

      <!-- Error Message -->
      <div id="error-message" class="error-message"></div>

      <!-- Signup Form -->
      <form id="signup-form" action="Insert" method="post">
        <div class="input-group">
          <i class="uil uil-user"></i>
          <input type="text" placeholder="First Name" name="firstName" required />
        </div>

        <div class="input-group">
          <i class="uil uil-user"></i>
          <input type="text" placeholder="Last Name" name="lastName" required />
        </div>

        <div class="input-group">
          <i class="uil uil-home"></i>
          <input type="text" placeholder="Address" name="address" required />
        </div>

        <div class="input-group">
          <i class="uil uil-envelope"></i>
          <input type="email" placeholder="Email" name="email" required />
        </div>

        <div class="input-group">
          <i class="uil uil-lock"></i>
          <input type="password" placeholder="Password" name="password" required />
        </div>

        <button type="submit" class="submit-button">Sign Up</button>

        <p class="switch-text">Already have an account? <a href="index.html">Log in</a></p>
      </form>

    </div>
  </div>

</body>
</html>
